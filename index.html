:root{--p:#6F55F5;--prgb:111,85,245;--p2:#8D52EA;--bg:#F7F5FF;--card:#FFFFFF;--tx:#1E1B33;--mut:#6B6788;--line:#E6E1F8;--pt:rgba(var(--prgb),.12);--ok:#16A870;--bad:#E5484D;--sh:0 6px 20px rgba(var(--prgb),.12)}
:root[data-mode=dark]{--bg:#14122A;--card:#1F1C3B;--tx:#F1EFFF;--mut:#A9A5C7;--line:#2E2A52;--pt:rgba(var(--prgb),.28);--sh:0 6px 20px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:var(--tx);-webkit-user-select:text;user-select:text}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:3px solid var(--p);outline-offset:2px}
h1,h2,h3,p{margin:0}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:560px;margin:0 auto;position:relative}
.top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px}
.top h1{flex:1;font-size:20px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:46px;height:46px;border-radius:16px;background:var(--card);box-shadow:var(--sh);font-size:21px;display:grid;place-items:center;flex:none}
.ib[disabled]{opacity:.35;box-shadow:none}
#warn{margin:0 14px 6px;padding:8px 12px;border-radius:12px;background:#FFE9D6;color:#8A3B00;font-size:13px;font-weight:500}
#warn[hidden]{display:none}
.main{flex:1;overflow-y:auto;padding:6px 14px 24px;-webkit-overflow-scrolling:touch}
.nav{display:flex;gap:4px;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px);background:var(--card);border-top:1px solid var(--line)}
.nav button{flex:1;min-height:56px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:12px;font-weight:500;color:var(--mut)}
.nav button span{font-size:22px;line-height:1.2}
.nav button.on{background:var(--pt);color:var(--p);font-weight:700}
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.hero{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:28px;padding:18px;display:flex;align-items:center;gap:16px;margin-bottom:14px;box-shadow:0 10px 26px rgba(var(--prgb),.35)}
.hero .big{font-size:30px;font-weight:700;line-height:1.1}
.hero .big small{font-size:15px;font-weight:500;opacity:.9}
.hero p{font-size:14px;margin-top:6px;opacity:.95}
.ring{position:relative;flex:none}
.ring svg{display:block}
.rin{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:700;line-height:1.1}
.hero .rin{font-size:24px}
.chips{display:flex;gap:10px;margin-bottom:14px}
.chip{flex:1;background:var(--card);border-radius:18px;padding:10px 12px;box-shadow:var(--sh);font-size:13px;color:var(--mut)}
.chip b{display:block;font-size:19px;color:var(--tx)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:18px;font-weight:700;font-size:16px;margin-top:10px;padding:0 16px}
.btn.pri{background:var(--p);color:#fff;box-shadow:0 8px 18px rgba(var(--prgb),.35)}
.btn.ghost{background:var(--pt);color:var(--p)}
.btn.txt{color:var(--mut);font-weight:500}
.btn.bad{background:rgba(229,72,77,.14);color:var(--bad)}
.row2{display:flex;gap:10px}
.row2 .btn{margin-top:0}
.sec{font-size:16px;font-weight:700;margin:18px 2px 8px}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.datebar .ib{box-shadow:none;background:var(--card)}

/* ---- template: neon (always dark, glow) ---- */
